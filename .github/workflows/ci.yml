name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install black ruff

      - name: Black
        run: black --check src tests

      - name: Ruff
        run: ruff check src tests

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -p "test_*.py"

  pipx-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx --version

      - name: pipx local install smoke
        run: ./dev/scripts/test_pipx_install_local.sh

  pipx-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx --version

      - name: Set pipx git ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "QSYNC_PIPX_GIT_URL=https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" >> "$GITHUB_ENV"
            echo "QSYNC_PIPX_GIT_REF=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "QSYNC_PIPX_GIT_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
            echo "QSYNC_PIPX_GIT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: pipx extras smoke
        run: ./dev/scripts/test_pipx_install_local.sh
