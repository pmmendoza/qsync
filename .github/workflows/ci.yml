name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install black ruff

      - name: Black
        run: black --check src tests

      - name: Ruff
        run: ruff check src tests

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -p "test_*.py" -t .

  pipx-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx --version

      - name: pipx local install smoke
        run: ./scripts/test_pipx_install_local.sh

  pipx-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx --version

      - name: Set pipx git ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "QSYNC_PIPX_GIT_URL=https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" >> "$GITHUB_ENV"
            echo "QSYNC_PIPX_GIT_REF=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "QSYNC_PIPX_GIT_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
            echo "QSYNC_PIPX_GIT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: pipx extras smoke
        run: ./scripts/test_pipx_install_local.sh

  pipx-pdf:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PIPX_HOME: ${{ runner.temp }}/pipx
      PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps (pdf)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libgdk-pixbuf2.0-0 libffi8

      - name: Install system deps (pdf)
        if: runner.os == 'macOS'
        run: brew install cairo pango gdk-pixbuf libffi

      - name: Install pipx
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          mkdir -p "$PIPX_HOME" "$PIPX_BIN_DIR"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          pipx --version

      - name: Set pipx git ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "QSYNC_PIPX_GIT_URL=https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git" >> "$GITHUB_ENV"
            echo "QSYNC_PIPX_GIT_REF=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "QSYNC_PIPX_GIT_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
            echo "QSYNC_PIPX_GIT_REF=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: pipx pdf smoke
        run: |
          pipx install "qsync[pdf] @ git+${QSYNC_PIPX_GIT_URL}@${QSYNC_PIPX_GIT_REF}"
          "$PIPX_HOME/venvs/qsync/bin/python" -c "import weasyprint"

  pipx-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PIPX_HOME: ${{ runner.temp }}\pipx
      PIPX_BIN_DIR: ${{ runner.temp }}\pipx\bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipx
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          New-Item -ItemType Directory -Force -Path $env:PIPX_HOME | Out-Null
          New-Item -ItemType Directory -Force -Path $env:PIPX_BIN_DIR | Out-Null
          Add-Content -Path $env:GITHUB_PATH -Value $env:PIPX_BIN_DIR
          python -m pipx --version

      - name: pipx local install smoke
        shell: pwsh
        run: |
          python -m pipx install .
          qsync --help
