[project]
name = "qsync"
version = "0.1.0"
description = "Qualtrics survey synchronization toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.0.0",
  "openpyxl>=3.0.0",
  "tenacity>=8.0.0",
  "questionary>=2.0.0",
  "python-docx>=1.2.0",
  "langdetect>=1.0.9",
  "rich>=13.0.0",
]

[project.optional-dependencies]
completion = [
  "argcomplete>=3.0.0",
]
pdf = [
  "weasyprint>=62.0",
]
langcheck = [
  # fasttext-wheel has reliable prebuilt wheels on macOS for older Python versions
  # (notably 3.11). Newer Pythons often fall back to source builds requiring a
  # working C++ toolchain (Xcode Command Line Tools).
  "fasttext-wheel>=0.9.2; python_version < '3.12'",
]

[project.scripts]
qsync = "qsync.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qsync = ["py.typed", "resources/*.csv"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "surveys",
  "excel",
  "responses",
  "logs",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
